name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site is published from the workflow artifact, so the run needs to be able
# to create a deployment and write the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a run in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # corepack fetches the pnpm version pinned in package.json; never wait for
      # a confirmation prompt on a fresh runner.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7

      # Pages metadata: a project site is served under the repository name, a
      # user site and a custom domain under the root. Reading it fails while
      # Pages is switched off in the repository settings, so the step must not
      # stop the build — the deploy step reports that problem with its own
      # message, and the base path falls back to the repository name.
      - id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The repo pins pnpm in package.json, so corepack provisions the same
      # version the scripts expect instead of a floating one from the image.
      - name: Enable the pinned pnpm
        run: corepack enable

      - name: Resolve the site base path
        id: base
        run: |
          base='${{ steps.pages.outputs.base_path }}'
          if [ -z "$base" ]; then
            case '${{ github.event.repository.name }}' in
              *.github.io) base='' ;;
              *) base='/${{ github.event.repository.name }}' ;;
            esac
          fi
          printf 'path=%s/\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Read the pnpm store path
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Typechecks every package and builds the static site; the prebuild step
      # copies the OCCT wasm into public/ so it ends up in dist/ as well.
      - name: Build the site
        run: corepack pnpm build
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
