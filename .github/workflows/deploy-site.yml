name: Deploy to icancad.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      remote_dir:
        description: Directory on the host the site is mirrored into
        required: false
        default: /

# The upload only reads the repository; the host is reached with the FTP_*
# secrets, which are handed to the upload step alone.
permissions:
  contents: read

# One upload at a time: the host serves files while they are being replaced, so
# two mirrors must not interleave. A newer push supersedes a run in flight.
concurrency:
  group: icancad.com
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # corepack fetches the pnpm version pinned in package.json; never wait for
      # a confirmation prompt on a fresh runner.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      # The account is chrooted to the directory the domain serves, so the site
      # starts at its root. A manual run can name another directory instead.
      REMOTE_DIR: ${{ inputs.remote_dir || '/' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The repo pins pnpm in package.json, so corepack provisions the same
      # version the scripts expect instead of a floating one from the image.
      - name: Enable the pinned pnpm
        run: corepack enable

      - name: Read the pnpm store path
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # icancad.com serves the app from its root, so the build keeps the
      # default base. The prebuild step copies the OCCT wasm into public/ and
      # so into dist/, and public/.htaccess travels with it.
      - name: Build the site
        run: corepack pnpm build
        env:
          VITE_BASE: /

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      # The secrets are trimmed once here: one pasted with a trailing line break
      # would be sent as an extra empty line, and the server reads that as an
      # empty password. GITHUB_ENV carries them to the steps that need them, and
      # the runner masks a secret value wherever it appears in a log.
      - name: Read the account
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          host="${FTP_HOST//[[:space:]]/}"
          user="${FTP_USERNAME//[[:space:]]/}"
          password="$FTP_PASSWORD"
          while [ "${password%[$'\r\n']}" != "$password" ]; do
            password="${password%[$'\r\n']}"
          done
          {
            echo "SITE_HOST=$host"
            echo "SITE_USER=$user"
            echo "SITE_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      # mirror -R sends only new and changed files and removes what the build no
      # longer contains. --upload-older covers hosts that cannot preserve file
      # times, where a fresh local file can otherwise look older than the remote
      # copy and be skipped. The target has no trailing slash: lftp would append
      # the source directory name to it.
      - name: Upload the build
        env:
          LFTP_PASSWORD: ${{ env.SITE_PASSWORD }}
        run: |
          # The password reaches lftp through LFTP_PASSWORD, so it never appears
          # in the command line or in an error message. The listing asks for
          # hidden files so that .htaccess is compared like any other file, and
          # the target directory is made first (quietly, as the root needs no
          # making): a login that fails stops here, before 63 MB of build tries
          # to follow it.
          lftp -c "
          set ftp:list-options -a
          set net:max-retries 3
          set net:timeout 30
          open --env-password -u '$SITE_USER' 'ftp://$SITE_HOST:21'
          mkdir -p -f $REMOTE_DIR
          mirror --reverse --delete --upload-older --parallel=4 --verbose=1 apps/web/dist/ $REMOTE_DIR
          "

      # The upload lands where the account points it, but only the domain says
      # whether that is the directory it serves from, so the site itself is
      # asked once the mirror is done.
      - name: Check the domain serves the build
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://icancad.com/ | grep -q '<title>ICanCAD</title>' &&
               curl -fsSI --max-time 20 https://icancad.com/pyodide/pyodide.js |
                 grep -qi '^content-type:.*javascript'; then
              echo "icancad.com serves the build and the formula runtime"
              exit 0
            fi
            sleep 10
          done
          echo "::error::icancad.com does not serve the uploaded build; check the site root and the JavaScript MIME type in the hosting panel"
          exit 1

      - name: Show the account's directories
        if: failure()
        env:
          LFTP_PASSWORD: ${{ env.SITE_PASSWORD }}
        run: |
          lftp -c "
          set ftp:list-options -a
          open --env-password -u '$SITE_USER' 'ftp://$SITE_HOST:21'
          pwd
          cls -1 /
          " || true
